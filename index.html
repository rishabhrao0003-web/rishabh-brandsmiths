<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rishabh's Room</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#0C0906; font-family:'Segoe UI',system-ui,sans-serif; }
    canvas { display:block; }

    /* ── Title Screen ──────────────────────────── */
    #title-screen {
      position:fixed; inset:0; z-index:300;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
      transition:opacity .8s ease;
    }
    #title-screen.fade-out { opacity:0; pointer-events:none; }
    #ts-decor { font-size:1.6rem; color:rgba(255,255,255,.25); margin-bottom:18px; letter-spacing:.5em; }
    #ts-title {
      font-family:Georgia,serif; font-size:clamp(2rem,5vw,3.4rem); font-weight:bold;
      color:#F5EDD8; letter-spacing:.06em; margin-bottom:8px; text-align:center;
      text-shadow:0 2px 20px rgba(0,0,0,.4);
    }
    #ts-sub {
      font-style:italic; color:rgba(245,237,216,.5);
      font-size:clamp(.85rem,2vw,1.05rem); margin-bottom:50px; text-align:center;
      max-width:400px; line-height:1.6;
    }
    #title-enter {
      font-family:Georgia,serif; font-size:.95rem; letter-spacing:.18em;
      padding:16px 52px; background:transparent; color:#F5EDD8;
      border:2px solid rgba(245,237,216,.4); border-radius:3px;
      cursor:pointer; transition:all .25s;
    }
    #title-enter:hover { background:rgba(245,237,216,.12); border-color:#F5EDD8; }

    /* ── Video Overlay ─────────────────────────── */
    #video-overlay {
      position:fixed; inset:0; z-index:200;
      background:rgba(0,0,0,.88);
      display:none; align-items:center; justify-content:center;
      flex-direction:column;
    }
    #video-overlay.active { display:flex; }
    #vo-title {
      font-family:Georgia,serif; font-size:1.4rem; color:#F5EDD8;
      margin-bottom:16px; letter-spacing:.08em;
      text-shadow:0 1px 8px rgba(0,0,0,.5);
      opacity:0; transform:translateY(-10px);
      animation:voFadeIn .4s .15s ease forwards;
    }
    #vo-video {
      max-width:85vw; max-height:72vh; border-radius:10px;
      background:#000; box-shadow:0 8px 40px rgba(0,0,0,.6);
      opacity:0; transform:scale(.92);
      animation:voScaleIn .45s .1s ease forwards;
    }
    #vo-close {
      position:absolute; top:20px; right:24px;
      width:40px; height:40px; border-radius:50%;
      background:rgba(255,255,255,.12); border:1.5px solid rgba(255,255,255,.3);
      color:#fff; font-size:1.1rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:background .15s;
    }
    #vo-close:hover { background:rgba(255,255,255,.25); }
    @keyframes voFadeIn { to { opacity:1; transform:translateY(0); } }
    @keyframes voScaleIn { to { opacity:1; transform:scale(1); } }

    /* ── Tooltip ────────────────────────────────── */
    #tooltip {
      position:fixed; z-index:100; pointer-events:none;
      background:rgba(0,0,0,.72); color:#F5EDD8;
      font-family:Georgia,serif; font-size:.82rem; letter-spacing:.08em;
      padding:6px 14px; border-radius:4px;
      opacity:0; transition:opacity .15s;
      white-space:nowrap;
      transform:translate(-50%,-120%);
    }
    #tooltip.visible { opacity:1; }

    /* ── Hint ───────────────────────────────────── */
    #hint {
      position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
      color:rgba(255,255,255,.45); font-size:.78rem; letter-spacing:.12em;
      pointer-events:none; text-shadow:0 1px 6px rgba(0,0,0,.6);
      transition:opacity .55s; z-index:60;
    }

    /* ── Mute Button ───────────────────────────── */
    #mute-btn {
      position:fixed; bottom:20px; right:18px; z-index:100;
      width:36px; height:36px; border-radius:50%;
      background:rgba(255,255,255,.1); border:1.5px solid rgba(255,255,255,.3);
      font-size:1rem; color:#fff; cursor:pointer;
      display:none; align-items:center; justify-content:center;
      transition:background .15s;
    }
    #mute-btn:hover { background:rgba(255,255,255,.22); }
    #mute-btn.muted { opacity:.4; }

    /* ── Custom Cursor ─────────────────────────── */
    body { cursor:none; }
    #custom-cursor {
      position:fixed; width:14px; height:14px;
      border:2px solid rgba(255,255,255,.5); border-radius:50%;
      pointer-events:none; z-index:9999;
      transform:translate(-50%,-50%);
      background:rgba(255,255,255,.04);
      transition:width .1s,height .1s,border-color .15s,background .15s;
    }
    #custom-cursor.pointer {
      width:18px; height:18px;
      border-color:rgba(255,200,60,.8);
      background:rgba(255,200,60,.12);
    }
  </style>
</head>
<body>

<div id="custom-cursor"></div>

<!-- Title Screen -->
<div id="title-screen">
  <div id="ts-decor">&#9679;&nbsp;&#9675;&nbsp;&#9679;</div>
  <div id="ts-title">Rishabh&rsquo;s Room</div>
  <div id="ts-sub">Click &amp; drag to look around.<br>Click on objects to explore.</div>
  <button id="title-enter">ENTER &nbsp; &#8594;</button>
</div>

<!-- Video Overlay -->
<div id="video-overlay">
  <button id="vo-close" aria-label="Close">&#x2715;</button>
  <div id="vo-title"></div>
  <video id="vo-video" controls></video>
</div>

<!-- Tooltip -->
<div id="tooltip"></div>

<!-- Hint -->
<div id="hint">CLICK &amp; DRAG TO LOOK AROUND &middot; CLICK OBJECTS TO EXPLORE</div>

<!-- Mute -->
<button id="mute-btn" title="Toggle music">&#9834;</button>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<!-- GLTFLoader -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
(function () {
  'use strict';

  // ════════════════════════════════════════════════
  //  RENDERER
  // ════════════════════════════════════════════════
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.appendChild(renderer.domElement);

  // ════════════════════════════════════════════════
  //  SCENE + CAMERA
  // ════════════════════════════════════════════════
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1510);
  scene.fog = new THREE.FogExp2(0x1a1510, 0.022);

  const camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.05, 80);
  camera.position.set(0, 1.65, 4.8);

  // Room dimensions
  const RW = 12, RH = 3.8, RD = 12;
  const HW = RW / 2, HD = RD / 2;

  // ════════════════════════════════════════════════
  //  MATERIALS
  // ════════════════════════════════════════════════
  const M = {
    floor:     new THREE.MeshStandardMaterial({ color: 0x8B6B3E, roughness: 0.75, metalness: 0.05 }),
    ceiling:   new THREE.MeshStandardMaterial({ color: 0xF2EDE4, roughness: 0.9 }),
    wallMain:  new THREE.MeshStandardMaterial({ color: 0xE8DDD0, roughness: 0.85 }),
    wallAccent:new THREE.MeshStandardMaterial({ color: 0xD8CFC0, roughness: 0.85 }),
    skirt:     new THREE.MeshStandardMaterial({ color: 0xF0E8DE, roughness: 0.6 }),
    darkWood:  new THREE.MeshStandardMaterial({ color: 0x3A2410, roughness: 0.55, metalness: 0.05 }),
    medWood:   new THREE.MeshStandardMaterial({ color: 0x6B4420, roughness: 0.6 }),
    lightWood: new THREE.MeshStandardMaterial({ color: 0xA07840, roughness: 0.6 }),
    metal:     new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.3, metalness: 0.7 }),
    darkMetal: new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.4, metalness: 0.6 }),
    black:     new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5 }),
    screen:    new THREE.MeshStandardMaterial({ color: 0x111828, roughness: 0.2, metalness: 0.1, emissive: 0x0a1020, emissiveIntensity: 0.3 }),
    fabric:    new THREE.MeshStandardMaterial({ color: 0x4a4a52, roughness: 0.9 }),
    redFabric: new THREE.MeshStandardMaterial({ color: 0x8B2020, roughness: 0.85 }),
    bedSheet:  new THREE.MeshStandardMaterial({ color: 0xE8E0D8, roughness: 0.95 }),
    pillow:    new THREE.MeshStandardMaterial({ color: 0xF0EAE0, roughness: 0.95 }),
    mirror:    new THREE.MeshStandardMaterial({ color: 0xC8D0D8, roughness: 0.05, metalness: 0.95 }),
    tile:      new THREE.MeshStandardMaterial({ color: 0xD8D4CC, roughness: 0.4 }),
    tileDark:  new THREE.MeshStandardMaterial({ color: 0xB8B0A4, roughness: 0.4 }),
    rubber:    new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.95 }),
    windowFrame: new THREE.MeshStandardMaterial({ color: 0xE0DCD5, roughness: 0.5 }),
    windowGlass: new THREE.MeshStandardMaterial({
      color: 0x4488CC, roughness: 0.05, metalness: 0.1,
      transparent: true, opacity: 0.55,
      side: THREE.DoubleSide
    }),
    door:      new THREE.MeshStandardMaterial({ color: 0x5C3A18, roughness: 0.55 }),
    doorFrame: new THREE.MeshStandardMaterial({ color: 0xE8E0D5, roughness: 0.5 }),
    yogaMat:   new THREE.MeshStandardMaterial({ color: 0x4A7060, roughness: 0.9 }),
    bookColors: [0xC83838, 0x2848A0, 0x28884A, 0xD89030, 0x7838A0, 0xB05828, 0x2888A0, 0x885020, 0xA02848, 0x38A048],
    rgb:       new THREE.MeshStandardMaterial({ color: 0x6020FF, emissive: 0x4010AA, emissiveIntensity: 0.6, roughness: 0.3 }),
    keyboard:  new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.6, metalness: 0.2 }),
    mouse:     new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5, metalness: 0.3 }),
  };

  // ════════════════════════════════════════════════
  //  HELPERS
  // ════════════════════════════════════════════════
  function box(w, h, d, mat) { return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); }
  function cyl(rT, rB, h, seg, mat) { return new THREE.Mesh(new THREE.CylinderGeometry(rT, rB, h, seg), mat); }

  // Tag meshes in a group as belonging to a zone
  function tagZone(group, zoneName) {
    group.traverse(c => { if (c.isMesh) c.userData.zone = zoneName; });
  }

  // ════════════════════════════════════════════════
  //  ROOM SHELL
  // ════════════════════════════════════════════════

  // Floor
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(RW, RD), M.floor);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // Ceiling
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(RW, RD), M.ceiling);
  ceil.rotation.x = Math.PI / 2;
  ceil.position.y = RH;
  scene.add(ceil);

  // Back wall (z = -HD)
  const bw = new THREE.Mesh(new THREE.PlaneGeometry(RW, RH), M.wallMain);
  bw.position.set(0, RH / 2, -HD);
  scene.add(bw);

  // Front wall (z = +HD) — with door cutout simulated by two flanking panels
  const fwLeftW = (RW - 1.1) / 2;
  const fwRightW = RW - fwLeftW - 1.1;
  // left portion
  const fwL = new THREE.Mesh(new THREE.PlaneGeometry(fwLeftW, RH), M.wallAccent);
  fwL.rotation.y = Math.PI;
  fwL.position.set(-RW / 2 + fwLeftW / 2, RH / 2, HD);
  scene.add(fwL);
  // right portion
  const fwR = new THREE.Mesh(new THREE.PlaneGeometry(fwRightW, RH), M.wallAccent);
  fwR.rotation.y = Math.PI;
  fwR.position.set(RW / 2 - fwRightW / 2, RH / 2, HD);
  scene.add(fwR);
  // above door
  const doorTopH = RH - 2.3;
  const fwTop = new THREE.Mesh(new THREE.PlaneGeometry(1.1, doorTopH), M.wallAccent);
  fwTop.rotation.y = Math.PI;
  fwTop.position.set(-RW / 2 + fwLeftW + 1.1 / 2, RH - doorTopH / 2, HD);
  scene.add(fwTop);

  // Left wall (x = -HW)
  const lw = new THREE.Mesh(new THREE.PlaneGeometry(RD, RH), M.wallMain);
  lw.rotation.y = Math.PI / 2;
  lw.position.set(-HW, RH / 2, 0);
  scene.add(lw);

  // Right wall (x = +HW) — simple full wall, bathroom sits in front of it
  const rw = new THREE.Mesh(new THREE.PlaneGeometry(RD, RH), M.wallMain);
  rw.rotation.y = -Math.PI / 2;
  rw.position.set(HW, RH / 2, 0);
  scene.add(rw);

  // Skirting boards
  const sH = 0.12, sT = 0.04;
  [[0, -HD + sT / 2, false, RW], [0, HD - sT / 2, false, RW],
   [-HW + sT / 2, 0, true, RD], [HW - sT / 2, 0, true, RD]].forEach(([px, pz, az, len]) => {
    const g = az ? new THREE.BoxGeometry(sT, sH, len) : new THREE.BoxGeometry(len, sH, sT);
    const m = new THREE.Mesh(g, M.skirt);
    m.position.set(px, sH / 2, pz);
    scene.add(m);
  });

  // ── Decorative Door (front wall) ──────────────
  const doorGroup = new THREE.Group();
  const doorX = -RW / 2 + fwLeftW + 1.1 / 2;
  // Door panel
  const doorPanel = box(0.95, 2.2, 0.06, M.door);
  doorPanel.position.set(0, 1.1, 0);
  doorGroup.add(doorPanel);
  // Door frame
  [[-0.52, 1.15, 0, 0.08, 2.35, 0.08], [0.52, 1.15, 0, 0.08, 2.35, 0.08],
   [0, 2.33, 0, 1.12, 0.08, 0.08]].forEach(([x, y, z, w, h, d]) => {
    const f = box(w, h, d, M.doorFrame);
    f.position.set(x, y, z);
    doorGroup.add(f);
  });
  // Door handle
  const handle = cyl(0.015, 0.015, 0.12, 8, M.metal);
  handle.rotation.x = Math.PI / 2;
  handle.position.set(0.35, 1.05, -0.05);
  doorGroup.add(handle);
  // Door panels (decorative insets)
  [[0, 0.55, -0.025, 0.6, 0.55, 0.015], [0, 1.55, -0.025, 0.6, 0.65, 0.015]].forEach(([x, y, z, w, h, d]) => {
    const p = box(w, h, d, M.door.clone());
    p.material.color.setHex(0x4A2C10);
    p.position.set(x, y, z);
    doorGroup.add(p);
  });
  doorGroup.position.set(doorX, 0, HD - 0.02);
  scene.add(doorGroup);

  // ════════════════════════════════════════════════
  //  ZONE 1: GAMING SETUP (About Me) — Left back
  // ════════════════════════════════════════════════
  const gamingGroup = new THREE.Group();

  // Desk
  const deskTop = box(1.6, 0.05, 0.75, M.darkWood);
  deskTop.position.set(0, 0.78, 0);
  deskTop.castShadow = true;
  gamingGroup.add(deskTop);
  // Desk legs
  [[-0.75, 0, -0.32], [-0.75, 0, 0.32], [0.75, 0, -0.32], [0.75, 0, 0.32]].forEach(([x, _, z]) => {
    const leg = box(0.05, 0.78, 0.05, M.darkWood);
    leg.position.set(x, 0.39, z);
    gamingGroup.add(leg);
  });
  // Back panel
  const deskBack = box(1.6, 0.45, 0.03, M.darkWood);
  deskBack.position.set(0, 0.55, -0.36);
  gamingGroup.add(deskBack);

  // Laptop
  // Base
  const laptopBase = box(0.42, 0.018, 0.3, M.keyboard);
  laptopBase.position.set(0, 0.82, 0.02);
  gamingGroup.add(laptopBase);
  // Screen (angled)
  const laptopScreen = box(0.40, 0.28, 0.012, M.black);
  laptopScreen.position.set(0, 1.01, -0.12);
  laptopScreen.rotation.x = -0.25;
  gamingGroup.add(laptopScreen);
  // Screen display
  const laptopDisplay = box(0.36, 0.23, 0.005, M.screen);
  laptopDisplay.position.set(0, 1.01, -0.115);
  laptopDisplay.rotation.x = -0.25;
  gamingGroup.add(laptopDisplay);

  // External mouse
  const mouseBody = box(0.05, 0.02, 0.08, M.mouse);
  mouseBody.position.set(0.45, 0.81, 0.05);
  gamingGroup.add(mouseBody);
  // Mousepad
  const mousepad = box(0.28, 0.005, 0.24, M.rubber);
  mousepad.position.set(0.42, 0.795, 0.02);
  gamingGroup.add(mousepad);

  // RGB strip under desk
  const rgbStrip = box(1.5, 0.02, 0.02, M.rgb);
  rgbStrip.position.set(0, 0.76, 0.37);
  gamingGroup.add(rgbStrip);

  // Gaming Chair
  const chairGroup = new THREE.Group();
  // Seat
  const seat = box(0.5, 0.08, 0.48, M.fabric);
  seat.position.set(0, 0.48, 0);
  chairGroup.add(seat);
  // Backrest
  const backrest = box(0.48, 0.65, 0.06, M.fabric);
  backrest.position.set(0, 0.85, -0.22);
  backrest.rotation.x = 0.08;
  chairGroup.add(backrest);
  // Headrest
  const headrest = box(0.28, 0.15, 0.06, M.redFabric);
  headrest.position.set(0, 1.22, -0.24);
  chairGroup.add(headrest);
  // Armrests
  [[-0.27, 0], [0.27, 0]].forEach(([x]) => {
    const arm = box(0.06, 0.04, 0.28, M.darkMetal);
    arm.position.set(x, 0.56, -0.05);
    chairGroup.add(arm);
    const armPost = box(0.04, 0.14, 0.04, M.darkMetal);
    armPost.position.set(x, 0.49, -0.05);
    chairGroup.add(armPost);
  });
  // Star base
  const basePole = cyl(0.03, 0.03, 0.28, 8, M.metal);
  basePole.position.set(0, 0.28, 0);
  chairGroup.add(basePole);
  for (let i = 0; i < 5; i++) {
    const angle = (i / 5) * Math.PI * 2;
    const leg = box(0.03, 0.025, 0.22, M.metal);
    leg.position.set(Math.sin(angle) * 0.12, 0.12, Math.cos(angle) * 0.12);
    leg.rotation.y = -angle;
    chairGroup.add(leg);
    // Caster
    const caster = cyl(0.025, 0.025, 0.03, 8, M.darkMetal);
    caster.position.set(Math.sin(angle) * 0.22, 0.06, Math.cos(angle) * 0.22);
    chairGroup.add(caster);
  }
  chairGroup.position.set(0, 0, 0.65);
  gamingGroup.add(chairGroup);

  // Headphone stand
  const hpStand = cyl(0.02, 0.04, 0.3, 8, M.metal);
  hpStand.position.set(-0.65, 0.95, 0.05);
  gamingGroup.add(hpStand);
  // Headphone arc
  const hpArc = box(0.18, 0.03, 0.04, M.darkMetal);
  hpArc.position.set(-0.65, 1.12, 0.05);
  gamingGroup.add(hpArc);

  gamingGroup.position.set(-3.8, 0, -4.2);
  tagZone(gamingGroup, 'about-me');
  scene.add(gamingGroup);

  // ════════════════════════════════════════════════
  //  ZONE 2: BOOKSHELF + GUITAR (Passions) — Back left
  // ════════════════════════════════════════════════
  const bookGroup = new THREE.Group();

  // Bookshelf frame
  const shelfW = 1.4, shelfH = 2.2, shelfD = 0.35;
  // Side panels
  const sideL = box(0.04, shelfH, shelfD, M.medWood);
  sideL.position.set(-shelfW / 2, shelfH / 2, 0);
  bookGroup.add(sideL);
  const sideR = box(0.04, shelfH, shelfD, M.medWood);
  sideR.position.set(shelfW / 2, shelfH / 2, 0);
  bookGroup.add(sideR);
  // Top, bottom, and shelves
  [0, 0.55, 1.1, 1.65, shelfH].forEach(y => {
    const shelf = box(shelfW, 0.035, shelfD, M.medWood);
    shelf.position.set(0, y, 0);
    bookGroup.add(shelf);
  });
  // Back panel
  const shelfBack = box(shelfW, shelfH, 0.015, M.lightWood);
  shelfBack.position.set(0, shelfH / 2, -shelfD / 2 + 0.008);
  bookGroup.add(shelfBack);

  // Books on shelves
  const shelfYs = [0.04, 0.59, 1.14, 1.69];
  shelfYs.forEach(sy => {
    let bx = -shelfW / 2 + 0.1;
    for (let i = 0; i < 7 + Math.floor(Math.random() * 4); i++) {
      const bw = 0.025 + Math.random() * 0.04;
      const bh = 0.3 + Math.random() * 0.18;
      const bd = shelfD * 0.75;
      const bMat = new THREE.MeshStandardMaterial({
        color: M.bookColors[i % M.bookColors.length], roughness: 0.8
      });
      const book = box(bw, bh, bd, bMat);
      book.position.set(bx + bw / 2, sy + bh / 2 + 0.02, 0.02);
      bookGroup.add(book);
      bx += bw + 0.005;
      if (bx > shelfW / 2 - 0.1) break;
    }
  });

  // Guitar on wall (hung above/beside shelf)
  const guitarGroup = new THREE.Group();
  // Body
  const gBody = cyl(0.18, 0.15, 0.08, 16, M.lightWood);
  gBody.rotation.x = Math.PI / 2;
  gBody.position.set(0, 0, 0);
  guitarGroup.add(gBody);
  // Sound hole
  const gHole = cyl(0.06, 0.06, 0.005, 16, M.black);
  gHole.rotation.x = Math.PI / 2;
  gHole.position.set(0, 0, 0.045);
  guitarGroup.add(gHole);
  // Neck
  const gNeck = box(0.06, 0.65, 0.03, M.medWood);
  gNeck.position.set(0, 0.42, 0);
  guitarGroup.add(gNeck);
  // Headstock
  const gHead = box(0.07, 0.14, 0.025, M.darkWood);
  gHead.position.set(0, 0.78, 0);
  guitarGroup.add(gHead);
  // Tuning pegs
  for (let i = 0; i < 3; i++) {
    const peg1 = cyl(0.01, 0.01, 0.04, 6, M.metal);
    peg1.rotation.z = Math.PI / 2;

  //  INTERACTION — Raycasting
  // ════════════════════════════════════════════════
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  const tooltip = document.getElementById('tooltip');
  const cursor = document.getElementById('custom-cursor');

  const zoneInfo = {
    'about-me':   { title: 'About Me',                  video: 'videos about-me.mp4' },
    'passions':   { title: 'My Passions',                video: 'videos passions.mp4' },
    'beauty':     { title: 'What Beauty Means to Me',    video: 'videos beauty.mp4' },
    'loreal':     { title: 'My L\u2019Or\u00e9al Brand', video: 'videos loreal.mp4' },
    'strengths':  { title: 'Strengths',                  video: 'videos strengths.mp4' },
    'weaknesses': { title: 'Weaknesses',                 video: 'videos weaknesses.mp4' },
  };

  let hoveredZone = null;

  function updateRaycast(clientX, clientY) {
    mouse.x = (clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(scene.children, true);
    let found = null;
    for (let i = 0; i < hits.length; i++) {
      if (hits[i].object.userData.zone) {
        found = hits[i].object.userData.zone;
        break;
      }
    }
    hoveredZone = found;
    if (found) {
      tooltip.textContent = zoneInfo[found].title;
      tooltip.style.left = clientX + 'px';
      tooltip.style.top = clientY + 'px';
      tooltip.classList.add('visible');
      cursor.classList.add('pointer');
    } else {
      tooltip.classList.remove('visible');
      cursor.classList.remove('pointer');
    }
  }

  //  VIDEO OVERLAY
  // ════════════════════════════════════════════════
  const voOverlay = document.getElementById('video-overlay');
  const voTitle = document.getElementById('vo-title');
  const voVideo = document.getElementById('vo-video');
  const voClose = document.getElementById('vo-close');

  function openVideo(zone) {
    const info = zoneInfo[zone];
    if (!info) return;
    voTitle.textContent = info.title;
    voVideo.src = info.video;
    voVideo.style.animation = 'none';
    voTitle.style.animation = 'none';
    void voVideo.offsetHeight;
    voVideo.style.animation = '';
    voTitle.style.animation = '';
    voOverlay.classList.add('active');
    voVideo.play().catch(() => {});
  }

  function closeVideo() {
    voOverlay.classList.remove('active');
    voVideo.pause();
    voVideo.currentTime = 0;
    voVideo.src = '';
  }

  voClose.addEventListener('click', closeVideo);

  // ════════════════════════════════════════════════
  //  LOOK-AROUND CONTROLS
  // ════════════════════════════════════════════════
  let yaw = Math.PI, pitch = -0.04;
  const SENS = 0.003, P_LIM = Math.PI * 0.42;
  const lookDir = new THREE.Vector3();

  function applyLook() {
    lookDir.set(
      Math.cos(pitch) * Math.sin(yaw),
      Math.sin(pitch),
      Math.cos(pitch) * Math.cos(yaw)
    );
    camera.lookAt(camera.position.clone().add(lookDir));
  }
  applyLook();

  const cvs = renderer.domElement;
  let dragging = false, didDrag = false, mx = 0, my = 0;

  cvs.addEventListener('mousedown', e => {
    dragging = true; didDrag = false;
    mx = e.clientX; my = e.clientY;
  });
  window.addEventListener('mousemove', e => {
    // Update cursor position
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';

    if (dragging) {
      const dx = e.clientX - mx, dy = e.clientY - my;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) didDrag = true;
      yaw -= dx * SENS;
      pitch -= dy * SENS;
      pitch = Math.max(-P_LIM, Math.min(P_LIM, pitch));
      mx = e.clientX; my = e.clientY;
      applyLook();
      tooltip.classList.remove('visible');
    } else {
      // Hover detection (only when not dragging)
      if (!voOverlay.classList.contains('active')) {
        updateRaycast(e.clientX, e.clientY);
      }
    }
  });
  window.addEventListener('mouseup', e => {
    if (!didDrag && !voOverlay.classList.contains('active')) {
      // It was a click, not a drag — check for zone hit
      updateRaycast(e.clientX, e.clientY);
      if (hoveredZone) {
        openVideo(hoveredZone);
      }
    }
    dragging = false;
    didDrag = false;
  });

    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
    touchDragged = false;
  }, { passive: true });
  cvs.addEventListener('touchmove', e => {
    e.preventDefault();
    const dx = e.touches[0].clientX - tx, dy = e.touches[0].clientY - ty;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) touchDragged = true;
    yaw -= dx * SENS;
    pitch -= dy * SENS;
    pitch = Math.max(-P_LIM, Math.min(P_LIM, pitch));
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
    applyLook();
  }, { passive: false });
  cvs.addEventListener('touchend', e => {

  //  AMBIENT AUDIO
  // ════════════════════════════════════════════════
  let audioCtx = null, masterGain = null, isMuted = false;
  const muteBtn = document.getElementById('mute-btn');

  function startAmbient() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.055;
      masterGain.connect(audioCtx.destination);
      const t = audioCtx.currentTime;

      // Am7 pad
      [110, 130.81, 164.81, 196, 220, 329.63].forEach((hz, i) => {
        const osc = audioCtx.createOscillator();
        const gn = audioCtx.createGain();
        const lfo = audioCtx.createOscillator();
        const lfg = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = hz;
        osc.detune.value = (i % 2 === 0 ? 1 : -1) * (3 + i * 1.1);
        lfo.type = 'sine';
        lfo.frequency.value = 0.05 + i * 0.017;
        lfg.gain.value = 0.1;
        lfo.connect(lfg); lfg.connect(gn.gain);
        gn.gain.setValueAtTime(0, t);
        gn.gain.linearRampToValueAtTime(0.18, t + 4 + i * 0.7);
        osc.connect(gn); gn.connect(masterGain);
        osc.start(t); lfo.start(t);
      });

      // Sub bass drone
      const sub = audioCtx.createOscillator();
      const subG = audioCtx.createGain();
      sub.type = 'sine'; sub.frequency.value = 55;
      subG.gain.setValueAtTime(0, t);
      subG.gain.linearRampToValueAtTime(0.15, t + 5);
      sub.connect(subG); subG.connect(masterGain); sub.start(t);

      // Filtered noise shimmer
      const sr = audioCtx.sampleRate;
      const buf = audioCtx.createBuffer(1, sr * 3, sr);
      const d = buf.getChannelData(0);
      for (let k = 0; k < d.length; k++) d[k] = Math.random() * 2 - 1;
      const nSrc = audioCtx.createBufferSource();
      nSrc.buffer = buf; nSrc.loop = true;
      const bpf = audioCtx.createBiquadFilter();
      bpf.type = 'bandpass'; bpf.frequency.value = 2700; bpf.Q.value = 1.4;
      const nG = audioCtx.createGain();
      nG.gain.setValueAtTime(0, t);
      nG.gain.linearRampToValueAtTime(0.005, t + 6);
      nSrc.connect(bpf); bpf.connect(nG); nG.connect(masterGain);
      nSrc.start(t);

      muteBtn.style.display = 'flex';
    } catch (e) {}
  }

  muteBtn.addEventListener('click', () => {
    if (!masterGain) return;
    isMuted = !isMuted;
    masterGain.gain.setTargetAtTime(isMuted ? 0 : 0.055, audioCtx.currentTime, 0.8);
    muteBtn.textContent = isMuted ? '\u2205' : '\u266a';
    muteBtn.classList.toggle('muted', isMuted);
  });

  // ════════════════════════════════════════════════
  //  TITLE SCREEN
  // ════════════════════════════════════════════════
  const titleScreen = document.getElementById('title-screen');
  document.getElementById('title-enter').addEventListener('click', () => {
    titleScreen.classList.add('fade-out');
    setTimeout(() => { titleScreen.style.display = 'none'; }, 850);
    startAmbient();
  });

  // ════════════════════════════════════════════════
  //  EMISSIVE PULSE ON INTERACTIVE OBJECTS
  // ════════════════════════════════════════════════
  const interactiveObjects = [];
  scene.traverse(c => {
    if (c.isMesh && c.userData.zone) {
      interactiveObjects.push(c);
      // Store original emissive
      c.userData.origEmissive = c.material.emissive ? c.material.emissive.getHex() : 0x000000;
      c.userData.origEmissiveI = c.material.emissiveIntensity || 0;
    }
  });

  // ════════════════════════════════════════════════
  //  RESIZE
  // ════════════════════════════════════════════════
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ════════════════════════════════════════════════
  //  RENDER LOOP
  // ════════════════════════════════════════════════
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    // Subtle emissive pulse on interactive objects
    const pulse = (Math.sin(t * 2.0) * 0.5 + 0.5) * 0.15;
    interactiveObjects.forEach(obj => {
      if (obj.material && obj.material.emissiveIntensity !== undefined) {
        obj.material.emissiveIntensity = obj.userData.origEmissiveI + pulse;
        if (obj.userData.origEmissive === 0) {
          obj.material.emissive.setHex(0xFFCC44);
          obj.material.emissiveIntensity = pulse * 0.5;
        }
      }
    });

    // RGB color cycling on gaming strip
    const r = Math.sin(t * 0.7) * 0.5 + 0.5;
    const g = Math.sin(t * 0.7 + 2.1) * 0.5 + 0.5;
    const b = Math.sin(t * 0.7 + 4.2) * 0.5 + 0.5;
    M.rgb.emissive.setRGB(r * 0.5, g * 0.3, b * 0.8);
    rgbLight.color.setRGB(r * 0.4, g * 0.2, b * 0.6);

    renderer.render(scene, camera);
  }
  animate();

})();
</script>
</body>
